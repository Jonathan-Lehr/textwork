name: iOS

on:
  schedule:
    - cron: "0 15 * * 1"
  workflow_dispatch:

jobs:
  build-ipad:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Build iOS Simulator app
        # Xcode passes -suppress-warnings to the local package. That flag
        # conflicts with warnings-as-errors, so suppression stays off in CI.
        run: |
          xcodebuild \
            -project Textwork.xcodeproj \
            -scheme Textwork \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            SWIFT_SUPPRESS_WARNINGS=NO \
            build
