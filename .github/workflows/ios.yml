name: iOS

on:
  schedule:
    - cron: "0 15 * * 1"
  workflow_dispatch:

jobs:
  build-ipad:
    # Fork pull requests must not run on the self-hosted Mac.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ fromJSON(vars.MACOS_RUNNER || '"macos-latest"') }}
    steps:
      - uses: actions/checkout@v4

      - name: Use the installed Xcode
        run: |
          if [ -d /Applications/Xcode.app/Contents/Developer ]; then
            echo "DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer" >> "$GITHUB_ENV"
          fi

      - name: Build iOS Simulator app
        # Xcode passes -suppress-warnings to the local package. That flag
        # conflicts with warnings-as-errors, so suppression stays off in CI.
        run: |
          xcodebuild \
            -project Textwork.xcodeproj \
            -scheme Textwork \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            SWIFT_SUPPRESS_WARNINGS=NO \
            build
